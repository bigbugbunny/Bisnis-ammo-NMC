<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Identitas - Nakama MC</title>
  
  <link rel="icon" type="image/png" href="../NakamaLogo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body { 
      background-color: #07090e; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      color: #e2e8f0; 
      overflow-x: hidden; 
    }
    .glass-card { 
      background: rgba(18, 24, 38, 0.85); 
      backdrop-filter: blur(12px); 
      border: 1px solid rgba(220, 38, 38, 0.25); 
    }
    @keyframes pulseGlow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.15; }
      50% { transform: translate(-50%, -50%) scale(1.15); opacity: 0.25; }
    }
    .bg-ambient-glow {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(239, 68, 68, 0.25) 0%, rgba(245, 158, 11, 0.08) 40%, transparent 70%);
      z-index: -1;
      pointer-events: none;
      animation: pulseGlow 10s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-ambient-glow"></div>

  <div class="glass-card p-8 rounded-2xl shadow-2xl w-full max-w-md space-y-6 border border-red-600/40 relative overflow-hidden">
    <div class="absolute -top-12 -left-12 w-32 h-32 bg-red-600/20 rounded-full blur-2xl pointer-events-none"></div>

    <div class="text-center space-y-3 relative z-10">
      <div class="w-20 h-20 bg-red-950/50 rounded-2xl flex items-center justify-center mx-auto border border-red-600/40 shadow-inner overflow-hidden p-1">
        <img src="../Nakama.png" alt="Logo" class="w-full h-full object-cover rounded-xl" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1048/1048953.png'">
      </div>
      <div>
        <h2 class="text-2xl font-black tracking-wider text-red-500">VERIFIKASI IDENTITAS</h2>
        <p class="text-xs text-gray-400 mt-1">Masukkan kredensial Anda untuk masuk ke sistem divisi Nakama MC</p>
      </div>
    </div>

    <div class="space-y-4 relative z-10">
      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Username</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
          <input type="text" id="loginUsername" placeholder="Masukkan username..." class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-3 text-white focus:outline-none focus:border-red-500 text-sm">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Sandi / Password</label>
        <div class="relative">
          <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-gray-500 text-sm"></i>
          <input type="password" id="loginPassword" placeholder="Masukkan sandi..." class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 pl-10 pr-3 text-white focus:outline-none focus:border-red-500 text-sm">
        </div>
      </div>

      <div id="loginError" class="text-xs text-red-400 text-center hidden bg-red-950/40 border border-red-800/40 py-2 rounded-lg font-semibold">
        Username atau sandi salah!
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="handleLogin()" class="w-full bg-gradient-to-r from-red-700 to-amber-600 hover:from-red-600 hover:to-amber-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2 tracking-wider text-xs">
          <i class="fa-solid fa-check"></i> MASUK
        </button>
        <a href="/dashboard/" class="w-full bg-slate-800 hover:bg-slate-700 text-gray-300 font-bold py-3.5 px-4 rounded-xl transition border border-slate-700 text-xs tracking-wider flex items-center justify-center text-center">
          KEMBALI
        </a>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBWZzjpvghve0zG9COIORa1i1SZJ4mLIoA",
      authDomain: "nmc-management.firebaseapp.com",
      databaseURL: "https://nmc-management-default-rtdb.firebaseio.com",
      projectId: "nmc-management",
      storageBucket: "nmc-management.firebasestorage.app",
      messagingSenderId: "551684270539",
      appId: "1:551684270539:web:0706d854b3ce6f731e6e4e"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function handleLogin() {
      const usernameInput = document.getElementById("loginUsername").value.trim();
      const passwordInput = document.getElementById("loginPassword").value.trim();
      const errorDiv = document.getElementById("loginError");

      if (!usernameInput || !passwordInput) {
        errorDiv.innerText = "Username dan sandi wajib diisi!";
        errorDiv.classList.remove("hidden");
        return;
      }

      db.ref('admin_users').once('value').then((snapshot) => {
        const admins = snapshot.val();
        let isAdmin = false;

        if (admins) {
          for (let userKey in admins) {
            if (userKey.toLowerCase() === usernameInput.toLowerCase()) {
              const userData = admins[userKey];
              const storedPass = (typeof userData === 'object' && userData !== null) ? userData.password : userData;
              if (String(storedPass) === String(passwordInput)) {
                isAdmin = true;
                break;
              }
            }
          }
        }

        if (isAdmin) {
          localStorage.setItem("nmc_user_role", "editor");
          localStorage.setItem("nmc_logged_user", usernameInput);
          window.location.href = "/dashboard/nakama/";
        } else {
          db.ref('member_users').once('value').then((memSnapshot) => {
            const members = memSnapshot.val();
            let isMember = false;

            if (members) {
              for (let userKey in members) {
                if (userKey.toLowerCase() === usernameInput.toLowerCase()) {
                  const userData = members[userKey];
                  const storedPass = (typeof userData === 'object' && userData !== null) ? userData.password : userData;
                  if (String(storedPass) === String(passwordInput)) {
                    isMember = true;
                    break;
                  }
                }
              }
            }

            if (isMember) {
              localStorage.setItem("nmc_user_role", "viewer");
              localStorage.setItem("nmc_logged_user", usernameInput);
              window.location.href = "/dashboard/nakama/";
            } else {
              errorDiv.innerText = "Username atau sandi salah!";
              errorDiv.classList.remove("hidden");
            }
          }).catch(() => {
            errorDiv.innerText = "Gagal terhubung ke database!";
            errorDiv.classList.remove("hidden");
          });
        }
      }).catch(() => {
        errorDiv.innerText = "Gagal terhubung ke database!";
        errorDiv.classList.remove("hidden");
      });
    }
  </script>
</body>
</html>
