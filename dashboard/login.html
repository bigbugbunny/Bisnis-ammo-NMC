<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifikasi Identitas - Nakama MC</title>
  
  <link rel="icon" type="image/png" href="../NakamaLogo.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
    body { 
      font-family: 'Inter', sans-serif; 
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen flex overflow-hidden">

  <!-- SISI KIRI: Form Login (Tema Gelap & Merah Khas Nakama) -->
  <div class="w-full lg:w-1/2 flex flex-col justify-between p-8 lg:p-16 z-10 bg-zinc-950/95 backdrop-blur-md overflow-y-auto">
    <!-- Header Atas / Logo Kecil -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-red-950/50 rounded-xl flex items-center justify-center border border-red-600/40 p-1">
        <img src="../Nakama.png" alt="Logo" class="w-full h-full object-cover rounded-lg" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1048/1048953.png'">
      </div>
      <span class="text-red-500 font-black tracking-wider text-sm">NAKAMA MC</span>
    </div>

    <!-- Form Container -->
    <div class="max-w-md w-full mx-auto my-auto py-8">
      <div class="mb-8 space-y-2">
        <h1 class="text-3xl font-extrabold tracking-tight text-white">Selamat Datang</h1>
        <p class="text-zinc-400 text-sm">Masukkan kredensial Anda untuk masuk ke sistem divisi Nakama MC.</p>
      </div>

      <!-- Notifikasi Error -->
      <div id="loginError" class="hidden mb-6 p-4 rounded-xl text-xs font-medium border bg-red-950/50 border-red-800/60 text-red-400 flex items-center gap-3">
        <i class="fa-solid fa-triangle-exclamation text-base"></i>
        <span id="errorText">Username atau sandi salah!</span>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Username</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-zinc-500">
              <i class="fa-solid fa-user"></i>
            </span>
            <input type="text" id="loginUsername" required 
              class="w-full pl-11 pr-4 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition text-sm"
              placeholder="Masukkan username...">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-400 mb-2">Sandi / Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-zinc-500">
              <i class="fa-solid fa-lock"></i>
            </span>
            <input type="password" id="loginPassword" required 
              class="w-full pl-11 pr-12 py-3 bg-zinc-900 border border-zinc-800 rounded-xl text-white placeholder-zinc-600 focus:outline-none focus:border-red-600 focus:ring-1 focus:ring-red-600 transition text-sm"
              placeholder="••••••••">
            <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-zinc-500 hover:text-white transition cursor-pointer">
              <i id="eyeIcon" class="fa-solid fa-eye text-sm"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center justify-between text-sm pt-1">
          <label class="flex items-center gap-2 cursor-pointer text-zinc-400 hover:text-zinc-300 text-xs">
            <input type="checkbox" id="remember" class="w-4 h-4 rounded bg-zinc-900 border-zinc-800 text-red-600 focus:ring-red-600 focus:ring-offset-zinc-950">
            <span>Ingat saya</span>
          </label>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2">
          <button type="submit" id="submitBtn" 
            class="w-full py-3.5 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white font-bold rounded-xl shadow-lg shadow-red-600/20 transition-all flex items-center justify-center gap-2 tracking-wider text-xs cursor-pointer">
            <i class="fa-solid fa-check"></i> <span>MASUK</span>
          </button>
          <a href="/dashboard" class="w-full bg-zinc-900 hover:bg-zinc-800 text-zinc-300 font-bold py-3.5 px-4 rounded-xl transition border border-zinc-800 text-xs tracking-wider flex items-center justify-center text-center no-underline cursor-pointer">
            KEMBALI
          </a>
        </div>
      </form>
    </div>

    <!-- Footer Bawah -->
    <div class="text-xs text-zinc-600">
      &copy; 2026 Triad Community / Nakama MC. All rights reserved.
    </div>
  </div>

  <!-- SISI KANAN: Galeri Komunitas / Banner Estetik (Gaya Split-Screen) -->
  <div class="hidden lg:flex lg:w-1/2 relative bg-zinc-900 items-center justify-center overflow-hidden">
    <div class="absolute inset-0 bg-cover bg-center opacity-50 mix-blend-luminosity" style="background-image: url('../Nakama.png');"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/60 to-transparent"></div>
    
    <div class="relative z-10 p-12 max-w-lg text-center">
      <div class="w-24 h-24 mx-auto mb-6 rounded-2xl bg-red-950/60 border border-red-500/30 flex items-center justify-center text-red-500 text-4xl shadow-2xl overflow-hidden p-2">
        <img src="../NakamaLogo.png" alt="Logo Besar" class="w-full h-full object-contain" onerror="this.src='../Nakama.png'">
      </div>
      <h2 class="text-2xl font-black text-white tracking-wider mb-3">NAKAMA MC DIVISION</h2>
      <p class="text-zinc-400 text-sm leading-relaxed">Sistem manajemen terpadu, absensi, dan kontrol operasional internal anggota komunitas.</p>
    </div>
  </div>

  <!-- Script Supabase & Logika Login -->
  <script>
    // Supabase Configuration & Initialization
    const SUPABASE_URL = 'https://atibhgbpdxvjngqdiklg.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PbD9KclxnhZGybuHJDkU3A_-Hz-MESZ'; 
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function togglePassword() {
      const passInput = document.getElementById("loginPassword");
      const eyeIcon = document.getElementById("eyeIcon");
      if (passInput.type === "password") {
        passInput.type = "text";
        eyeIcon.classList.replace("fa-eye", "fa-eye-slash");
      } else {
        passInput.type = "password";
        eyeIcon.classList.replace("fa-eye-slash", "fa-eye");
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const usernameInput = document.getElementById("loginUsername").value.trim();
      const passwordInput = document.getElementById("loginPassword").value.trim();
      const errorDiv = document.getElementById("loginError");
      const errorText = document.getElementById("errorText");
      const submitBtn = document.getElementById("submitBtn");

      errorDiv.classList.add("hidden");

      if (!usernameInput || !passwordInput) {
        errorText.innerText = "Username dan sandi wajib diisi!";
        errorDiv.classList.remove("hidden");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> <span>MEMERIKSA...</span>`;

      try {
        const { data: admins, error } = await supabaseClient
          .from('admin_users')
          .select('*');

        if (error) throw error;

        let isAdmin = false;
        if (admins) {
          for (let admin of admins) {
            if (admin.username && admin.username.toLowerCase() === usernameInput.toLowerCase()) {
              if (String(admin.password) === String(passwordInput)) {
                isAdmin = true;
                break;
              }
            }
          }
        }

        if (isAdmin) {
          localStorage.setItem("nmc_user_role", "editor");
          localStorage.setItem("nmc_logged_user", usernameInput);
          window.location.href = "./";
        } else {
          showError("Username atau sandi salah!");
        }
      } catch (err) {
        console.error("Login error:", err);
        showError("Gagal terhubung ke database Supabase!");
      }
    }

    function showError(msg) {
      const errorDiv = document.getElementById("loginError");
      const errorText = document.getElementById("errorText");
      const submitBtn = document.getElementById("submitBtn");
      errorText.innerText = msg;
      errorDiv.classList.remove("hidden");
      
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i class="fa-solid fa-check"></i> <span>MASUK</span>`;
    }
  </script>
</body>
</html>
