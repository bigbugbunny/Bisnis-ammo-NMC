name: TikTok Live Auto Checker

on:
  schedule:
    # Menjalankan skrip otomatis setiap 5 menit sekali
    - cron: '*/5 * * * *'
  workflow_dispatch: # Agar bisa dijalankan manual juga dari tab Actions

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies
        run: npm install @supabase/supabase-js node-fetch

      - name: Run TikTok Checker Script
        env:
          SUPABASE_URL: 'https://atibhgbpdxvjngqdiklg.supabase.co'
          SUPABASE_ANON_KEY: 'sb_publishable_PbD9KclxnhZGybuHJDkU3A_-Hz-MESZ'
        run: node .github/scripts/tiktok-checker.js
