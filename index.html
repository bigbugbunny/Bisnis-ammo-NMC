<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMC Multi-Group Business Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="text-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header & Pilihan Kelompok -->
    <div class="flex flex-col md:flex-row justify-between items-center bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 via-amber-300 to-emerald-400">
          ⚡ NMC MULTI-GROUP MANAGEMENT
        </h1>
        <p class="text-sm text-gray-400 mt-1">Sistem Pengelola Transaksi Multi-Item Partner</p>
      </div>
      
      <!-- Selector Kelompok -->
      <div class="mt-4 md:mt-0 w-full md:w-auto">
        <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">Pilih Kelompok / Partner:</label>
        <select id="groupSelect" onchange="loadGroupData()" class="w-full md:w-64 bg-slate-900 border border-amber-500/50 rounded-xl p-2.5 text-white font-bold focus:outline-none focus:border-amber-400">
          <option value="th21">1. 21TH</option>
          <option value="voldemort">2. Voldemort</option>
          <option value="mugen">3. Mugen</option>
          <option value="atlanta">4. Atlanta</option>
          <option value="brooklyn">5. Brooklyn</option>
          <option value="s90">6. 90S</option>
          <option value="angker">7. Angker</option>
          <option value="white_tiger">8. White Tiger</option>
          <option value="mayans" selected>9. Mayans</option>
        </select>
      </div>
    </div>

    <!-- RINCIAN HARGA KELOMPOK AKTIF -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Harga Jual -->
      <div class="glass-card p-5 rounded-2xl border border-slate-700">
        <h2 class="text-md font-bold text-green-400 mb-3 flex items-center justify-between">
          <span><i class="fa-solid fa-tag"></i> HARGA JUAL AMMO</span>
          <span id="activeGroupNameBadge" class="text-xs bg-slate-800 text-amber-400 px-2.5 py-1 rounded-full border border-slate-700">Mayans</span>
        </h2>
        <div id="ammoPriceList" class="space-y-2 text-sm"></div>
      </div>

      <!-- Harga Beli -->
      <div class="glass-card p-5 rounded-2xl border border-slate-700">
        <h2 class="text-md font-bold text-red-400 mb-3 flex items-center justify-between">
          <span><i class="fa-solid fa-cart-shopping"></i> HARGA BELI / LAYANAN</span>
        </h2>
        <div id="itemPriceList" class="grid grid-cols-2 gap-2 text-xs"></div>
      </div>
    </div>

    <!-- KALKULATOR PENJUALAN AMMO (MULTI-ITEM) -->
    <div class="glass-card p-6 rounded-2xl border border-slate-700 shadow-lg space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-green-400 flex items-center gap-2">
          <i class="fa-solid fa-calculator"></i> KALKULATOR PENJUALAN AMMO
        </h2>
        <button onclick="addAmmoRow()" class="bg-green-600/80 hover:bg-green-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> Tambah Ammo
        </button>
      </div>

      <div id="ammoRowsContainer" class="space-y-3">
        <!-- Baris-baris Ammo dimasukkan lewat Javascript -->
      </div>

      <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
        <span class="text-sm text-gray-400">Total Seluruh Tagihan Ammo:</span>
        <span id="grandTotalAmmo" class="text-2xl font-black text-green-400">0</span>
      </div>
    </div>

    <!-- KALKULATOR PEMBELIAN BARANG / LAYANAN (MULTI-ITEM) -->
    <div class="glass-card p-6 rounded-2xl border border-slate-700 shadow-lg space-y-4">
      <div class="flex justify-between items-center">
        <h2 class="text-lg font-bold text-red-400 flex items-center gap-2">
          <i class="fa-solid fa-gun"></i> KALKULATOR PEMBELIAN / LAYANAN
        </h2>
        <button onclick="addItemRow()" class="bg-red-600/80 hover:bg-red-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition flex items-center gap-1">
          <i class="fa-solid fa-plus"></i> Tambah Barang
        </button>
      </div>

      <div id="itemRowsContainer" class="space-y-3">
        <!-- Baris-baris Barang dimasukkan lewat Javascript -->
      </div>

      <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
        <span class="text-sm text-gray-400">Total Seluruh Pembelian / Fee:</span>
        <span id="grandTotalItem" class="text-2xl font-black text-red-400">0</span>
      </div>
    </div>

    <button onclick="copySummary()" class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-copy"></i> Salin Ringkasan Transaksi Kelompok
    </button>

  </div>

  <script>
    const groupsData = {
      "th21": {
        name: "21TH",
        ammo: { "50AE": 80000, "9MM": 115000, "38LC": 145000 },
        items: { "Baju Hangat": { price: 100000, promo: "Max 100 Pcs/Minggu", isRate: false } }
      },
      "voldemort": {
        name: "Voldemort",
        ammo: { "50AE": 75000, "9MM": 120000, "38LC": 140000 },
        items: { "Baju Hangat": { price: 110000, promo: "Max 50 Pcs", isRate: false } }
      },
      "mugen": {
        name: "Mugen",
        ammo: { "50AE": 75000, "9MM": 115000, "38LC": 130000 },
        items: {
          "Cuci Uang (20%)": { price: 0.20, promo: "Max 15 Juta", isRate: true },
          "Cuci Uang (30%)": { price: 0.30, promo: "Tanpa Max", isRate: true }
        }
      },
      "atlanta": {
        name: "Atlanta",
        ammo: { "50AE": 100000, "9MM": 150000, "38LC": 145000 },
        items: {
          "Kecubung": { price: 23000, promo: "", isRate: false },
          "Jamur": { price: 23000, promo: "", isRate: false },
          "Wide": { price: 23000, promo: "", isRate: false }
        }
      },
      "brooklyn": {
        name: "Brooklyn",
        ammo: { "50AE": 75000, "9MM": 110000, "38LC": 140000 },
        items: {
          "Kecubung": { price: 20000, promo: "", isRate: false },
          "Jamur": { price: 20000, promo: "", isRate: false },
          "Wide": { price: 20000, promo: "", isRate: false }
        }
      },
      "s90": {
        name: "90S",
        ammo: { "50AE": 80000, "9MM": 115000, "38LC": 140000 },
        items: { "Baju Hangat": { price: 100000, promo: "", isRate: false } }
      },
      "angker": {
        name: "Angker",
        ammo: { "50AE": 80000, "9MM": 120000, "38LC": 155000 },
        items: {
          "Kecubung": { price: 23000, promo: "", isRate: false },
          "Jamur": { price: 23000, promo: "", isRate: false },
          "Wide": { price: 23000, promo: "", isRate: false }
        }
      },
      "white_tiger": {
        name: "White Tiger",
        ammo: { "50AE": 70000, "9MM": 110000, "38LC": 140000 },
        items: {
          "Umer ke Putih (15%)": { price: 0.15, promo: "", isRate: true },
          "Putih ke Umer (18%)": { price: 0.18, promo: "", isRate: true }
        }
      },
      "mayans": {
        name: "Mayans",
        ammo: { "9MM": 113000, "38LC": 120000 },
        items: {
          "DA": { price: 150000, promo: "10 Free 2", isRate: false },
          "P50": { price: 130000, promo: "", isRate: false },
          "TAC9": { price: 110000, promo: "", isRate: false },
          "CERAMIC": { price: 90000, promo: "", isRate: false }
        }
      }
    };

    let currentGroupKey = "mayans";

    function loadGroupData() {
      currentGroupKey = document.getElementById("groupSelect").value;
      const group = groupsData[currentGroupKey];

      document.getElementById("activeGroupNameBadge").innerText = group.name;

      // Render Rincian Harga Ammo
      const ammoListDiv = document.getElementById("ammoPriceList");
      ammoListDiv.innerHTML = "";
      for (let ammo in group.ammo) {
        ammoListDiv.innerHTML += `
          <div class="flex justify-between bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <span>${ammo} (1 pack)</span>
            <span class="font-bold text-green-400">${group.ammo[ammo].toLocaleString('id-ID')}</span>
          </div>`;
      }

      // Render Rincian Harga Barang/Layanan
      const itemListDiv = document.getElementById("itemPriceList");
      itemListDiv.innerHTML = "";
      for (let item in group.items) {
        const data = group.items[item];
        const displayPrice = data.isRate ? `${data.price * 100}%` : `${data.price.toLocaleString('id-ID')} / PC`;
        itemListDiv.innerHTML += `
          <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
            <div class="text-gray-400">${item}</div>
            <div class="font-bold text-red-400">${displayPrice}</div>
            ${data.promo ? `<div class="text-[10px] text-amber-400 mt-0.5">${data.promo}</div>` : ''}
          </div>`;
      }

      // Reset Container Row
      document.getElementById("ammoRowsContainer").innerHTML = "";
      document.getElementById("itemRowsContainer").innerHTML = "";

      addAmmoRow();
      addItemRow();
    }

    function addAmmoRow() {
      const group = groupsData[currentGroupKey];
      const container = document.getElementById("ammoRowsContainer");
      const rowId = "ammo_row_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4);

      let optionsHTML = "";
      for (let ammo in group.ammo) {
        optionsHTML += `<option value="${ammo}">${ammo} (${group.ammo[ammo].toLocaleString('id-ID')}/pack)</option>`;
      }

      const rowHTML = `
        <div id="${rowId}" class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center bg-slate-900/60 p-3 rounded-xl border border-slate-800">
          <div class="md:col-span-5">
            <select class="ammo-type-select w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-green-500" onchange="calculateAll()">
              ${optionsHTML}
            </select>
          </div>
          <div class="md:col-span-3">
            <input type="number" value="10" min="1" class="ammo-qty-input w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-green-500" placeholder="Qty Pack" oninput="calculateAll()">
          </div>
          <div class="md:col-span-3 text-right font-bold text-green-400 text-sm">
            Rp <span class="ammo-row-total">0</span>
          </div>
          <div class="md:col-span-1 text-center">
            <button onclick="removeRow('${rowId}')" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>`;

      container.insertAdjacentHTML('beforeend', rowHTML);
      calculateAll();
    }

    function addItemRow() {
      const group = groupsData[currentGroupKey];
      const container = document.getElementById("itemRowsContainer");
      const rowId = "item_row_" + Date.now() + "_" + Math.random().toString(36).substr(2, 4);

      let optionsHTML = "";
      for (let item in group.items) {
        const data = group.items[item];
        const displayPrice = data.isRate ? `${data.price * 100}%` : `${data.price.toLocaleString('id-ID')}/pc`;
        optionsHTML += `<option value="${item}">${item} (${displayPrice})</option>`;
      }

      if (Object.keys(group.items).length === 0) {
        optionsHTML = `<option value="">(Tidak Ada Barang)</option>`;
      }

      const rowHTML = `
        <div id="${rowId}" class="grid grid-cols-1 md:grid-cols-12 gap-3 items-center bg-slate-900/60 p-3 rounded-xl border border-slate-800">
          <div class="md:col-span-5">
            <select class="item-type-select w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-red-500" onchange="calculateAll()">
              ${optionsHTML}
            </select>
          </div>
          <div class="md:col-span-3">
            <input type="number" value="10" min="1" class="item-qty-input w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-red-500" placeholder="Jumlah / Nomimal" oninput="calculateAll()">
          </div>
          <div class="md:col-span-3 text-right font-bold text-red-400 text-sm">
            <div class="item-row-total-text">Rp <span class="item-row-total">0</span></div>
            <div class="item-row-bonus text-[10px] text-amber-400"></div>
          </div>
          <div class="md:col-span-1 text-center">
            <button onclick="removeRow('${rowId}')" class="text-red-400 hover:text-red-300 p-2"><i class="fa-solid fa-trash"></i></button>
          </div>
        </div>`;

      container.insertAdjacentHTML('beforeend', rowHTML);
      calculateAll();
    }

    function removeRow(rowId) {
      const row = document.getElementById(rowId);
      if (row) {
        row.remove();
        calculateAll();
      }
    }

    function calculateAll() {
      const group = groupsData[currentGroupKey];

      // Hitung Ammo Rows
      let totalAmmoSum = 0;
      const ammoRows = document.querySelectorAll("#ammoRowsContainer > div");
      ammoRows.forEach(row => {
        const type = row.querySelector(".ammo-type-select").value;
        const qty = parseFloat(row.querySelector(".ammo-qty-input").value) || 0;
        const price = (group.ammo && group.ammo[type]) ? group.ammo[type] : 0;
        const rowTotal = price * qty;
        totalAmmoSum += rowTotal;
        row.querySelector(".ammo-row-total").innerText = rowTotal.toLocaleString('id-ID');
      });
      document.getElementById("grandTotalAmmo").innerText = totalAmmoSum.toLocaleString('id-ID');

      // Hitung Item Rows
      let totalItemSum = 0;
      const itemRows = document.querySelectorAll("#itemRowsContainer > div");
      itemRows.forEach(row => {
        const type = row.querySelector(".item-type-select").value;
        const qty = parseFloat(row.querySelector(".item-qty-input").value) || 0;
        const data = (group.items && group.items[type]) ? group.items[type] : null;

        if (!data) {
          row.querySelector(".item-row-total").innerText = "0";
          row.querySelector(".item-row-bonus").innerText = "";
          return;
        }

        let rowTotal = 0;
        let bonusText = "";

        if (data.isRate) {
          rowTotal = qty * data.price;
          bonusText = `Fee: ${data.price * 100}%`;
        } else {
          rowTotal = data.price * qty;
          if (type === "DA" && data.promo.includes("10 Free 2")) {
            const bonusPcs = Math.floor(qty / 10) * 2;
            bonusText = bonusPcs > 0 ? `Bonus: ${bonusPcs} PC (Tot: ${qty + bonusPcs})` : "";
          }
        }

        totalItemSum += rowTotal;
        row.querySelector(".item-row-total").innerText = rowTotal.toLocaleString('id-ID');
        row.querySelector(".item-row-bonus").innerText = bonusText;
      });
      document.getElementById("grandTotalItem").innerText = totalItemSum.toLocaleString('id-ID');
    }

    function copySummary() {
      const groupName = groupsData[currentGroupKey].name;
      const group = groupsData[currentGroupKey];

      let text = `🤝 *TRANSAKSI PARTNER: ${groupName.toUpperCase()}*\n\n📦 *Penjualan Ammo:*\n`;

      const ammoRows = document.querySelectorAll("#ammoRowsContainer > div");
      if (ammoRows.length === 0) text += `- Tidak ada\n`;
      ammoRows.forEach(row => {
        const type = row.querySelector(".ammo-type-select").value;
        const qty = row.querySelector(".ammo-qty-input").value || 0;
        const total = row.querySelector(".ammo-row-total").innerText;
        text += `- ${type} (${qty} Pack) = Rp ${total}\n`;
      });
      text += `*Total Tagihan Ammo:* Rp ${document.getElementById("grandTotalAmmo").innerText}\n\n🛒 *Pembelian / Layanan:*\n`;

      const itemRows = document.querySelectorAll("#itemRowsContainer > div");
      if (itemRows.length === 0) text += `- Tidak ada\n`;
      itemRows.forEach(row => {
        const type = row.querySelector(".item-type-select").value;
        const qty = row.querySelector(".item-qty-input").value || 0;
        const total = row.querySelector(".item-row-total").innerText;
        const bonus = row.querySelector(".item-row-bonus").innerText;
        text += `- ${type} (${qty}) = Rp ${total} ${bonus ? `[${bonus}]` : ''}\n`;
      });
      text += `*Total Pembelian/Fee:* Rp ${document.getElementById("grandTotalItem").innerText}`;

      navigator.clipboard.writeText(text);
      alert(`Ringkasan seluruh transaksi untuk ${groupName} berhasil disalin!`);
    }

    // Initial load
    loadGroupData();
  </script>
</body>
</html>
