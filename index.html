<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMC Multi-Group Business Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="text-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header & Pilihan Kelompok -->
    <div class="flex flex-col md:flex-row justify-between items-center bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 via-amber-300 to-emerald-400">
          ⚡ NMC MULTI-GROUP MANAGEMENT
        </h1>
        <p class="text-sm text-gray-400 mt-1">Sistem Pengelola Transaksi 9 Kelompok Partner</p>
      </div>
      
      <!-- Selector Kelompok -->
      <div class="mt-4 md:mt-0 w-full md:w-auto">
        <label class="block text-xs font-bold text-amber-400 uppercase tracking-wider mb-1">Pilih Kelompok / Partner:</label>
        <select id="groupSelect" onchange="loadGroupData()" class="w-full md:w-64 bg-slate-900 border border-amber-500/50 rounded-xl p-2.5 text-white font-bold focus:outline-none focus:border-amber-400">
          <option value="th21">1. 21TH</option>
          <option value="voldemort">2. Voldemort</option>
          <option value="mugen">3. Mugen</option>
          <option value="atlanta">4. Atlanta</option>
          <option value="brooklyn">5. Brooklyn</option>
          <option value="s90">6. 90S</option>
          <option value="angker">7. Angker</option>
          <option value="white_tiger">8. White Tiger</option>
          <option value="mayans" selected>9. Mayans</option>
        </select>
      </div>
    </div>

    <!-- RINCIAN HARGA KELOMPOK AKTIF -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Harga Jual -->
      <div class="glass-card p-5 rounded-2xl border border-slate-700">
        <h2 class="text-md font-bold text-green-400 mb-3 flex items-center justify-between">
          <span><i class="fa-solid fa-tag"></i> HARGA JUAL AMMO</span>
          <span id="activeGroupNameBadge" class="text-xs bg-slate-800 text-amber-400 px-2.5 py-1 rounded-full border border-slate-700">Mayans</span>
        </h2>
        <div id="ammoPriceList" class="space-y-2 text-sm">
          <!-- Otomatis diisi lewat Javascript -->
        </div>
      </div>

      <!-- Harga Beli -->
      <div class="glass-card p-5 rounded-2xl border border-slate-700">
        <h2 class="text-md font-bold text-red-400 mb-3 flex items-center justify-between">
          <span><i class="fa-solid fa-cart-shopping"></i> HARGA BELI / LAYANAN</span>
        </h2>
        <div id="itemPriceList" class="grid grid-cols-2 gap-2 text-xs">
          <!-- Otomatis diisi lewat Javascript -->
        </div>
      </div>
    </div>

    <!-- KALKULATOR PENJUALAN AMMO -->
    <div class="glass-card p-6 rounded-2xl border border-slate-700 shadow-lg space-y-4">
      <h2 class="text-lg font-bold text-green-400 flex items-center gap-2">
        <i class="fa-solid fa-calculator"></i> KALKULATOR PENJUALAN AMMO
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Tipe Ammo</label>
          <select id="ammoType" onchange="calcAmmo()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-green-500">
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Jumlah Pack</label>
          <input type="number" id="ammoQty" value="10" min="1" oninput="calcAmmo()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-green-500">
        </div>

        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 flex flex-col justify-center">
          <span class="text-xs text-gray-400">Total Tagihan Ammo:</span>
          <span id="totalAmmoPrice" class="text-2xl font-black text-green-400">0</span>
        </div>
      </div>
    </div>

    <!-- KALKULATOR PEMBELIAN BARANG/SENJATA -->
    <div class="glass-card p-6 rounded-2xl border border-slate-700 shadow-lg space-y-4">
      <h2 class="text-lg font-bold text-red-400 flex items-center gap-2">
        <i class="fa-solid fa-gun"></i> KALKULATOR PEMBELIAN / LAYANAN
      </h2>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Jenis Barang/Layanan</label>
          <select id="itemType" onchange="calcItem()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-red-500">
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-1">Jumlah / Nomimal</label>
          <input type="number" id="itemQty" value="10" min="1" oninput="calcItem()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-red-500">
        </div>

        <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800 flex flex-col justify-center">
          <span class="text-xs text-gray-400">Total Biaya Beli / Fee:</span>
          <span id="totalItemPrice" class="text-2xl font-black text-red-400">0</span>
          <span id="bonusInfo" class="text-xs text-amber-400 mt-1">Dapat Total: 10 PC</span>
        </div>
      </div>
    </div>

    <button onclick="copySummary()" class="w-full bg-gradient-to-r from-green-600 to-emerald-600 hover:from-green-500 hover:to-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-copy"></i> Salin Ringkasan Transaksi Kelompok
    </button>

  </div>

  <script>
    // DATABASE 9 KELOMPOK LENGKAP
    const groupsData = {
      "th21": {
        name: "21TH",
        ammo: { "50AE": 80000, "9MM": 115000, "38LC": 145000 },
        items: { "Baju Hangat": { price: 100000, promo: "Max 100 Pcs/Minggu", isRate: false } }
      },
      "voldemort": {
        name: "Voldemort",
        ammo: { "50AE": 75000, "9MM": 120000, "38LC": 140000 },
        items: { "Baju Hangat": { price: 110000, promo: "Max 50 Pcs", isRate: false } }
      },
      "mugen": {
        name: "Mugen",
        ammo: { "50AE": 75000, "9MM": 115000, "38LC": 130000 },
        items: {
          "Cuci Uang (20%)": { price: 0.20, promo: "Max 15 Juta", isRate: true },
          "Cuci Uang (30%)": { price: 0.30, promo: "Tanpa Max", isRate: true }
        }
      },
      "atlanta": {
        name: "Atlanta",
        ammo: { "50AE": 100000, "9MM": 150000, "38LC": 145000 },
        items: {
          "Kecubung": { price: 23000, promo: "", isRate: false },
          "Jamur": { price: 23000, promo: "", isRate: false },
          "Wide": { price: 23000, promo: "", isRate: false }
        }
      },
      "brooklyn": {
        name: "Brooklyn",
        ammo: { "50AE": 75000, "9MM": 110000, "38LC": 140000 },
        items: {
          "Kecubung": { price: 20000, promo: "", isRate: false },
          "Jamur": { price: 20000, promo: "", isRate: false },
          "Wide": { price: 20000, promo: "", isRate: false }
        }
      },
      "s90": {
        name: "90S",
        ammo: { "50AE": 80000, "9MM": 115000, "38LC": 140000 },
        items: { "Baju Hangat": { price: 100000, promo: "", isRate: false } }
      },
      "angker": {
        name: "Angker",
        ammo: { "50AE": 80000, "9MM": 120000, "38LC": 155000 },
        items: {
          "Kecubung": { price: 23000, promo: "", isRate: false },
          "Jamur": { price: 23000, promo: "", isRate: false },
          "Wide": { price: 23000, promo: "", isRate: false }
        }
      },
      "white_tiger": {
        name: "White Tiger",
        ammo: { "50AE": 70000, "9MM": 110000, "38LC": 140000 },
        items: {
          "Umer ke Putih (15%)": { price: 0.15, promo: "", isRate: true },
          "Putih ke Umer (18%)": { price: 0.18, promo: "", isRate: true }
        }
      },
      "mayans": {
        name: "Mayans",
        ammo: { "9MM": 113000, "38LC": 120000 },
        items: {
          "DA": { price: 150000, promo: "10 Free 2", isRate: false },
          "P50": { price: 130000, promo: "", isRate: false },
          "TAC9": { price: 110000, promo: "", isRate: false },
          "CERAMIC": { price: 90000, promo: "", isRate: false }
        }
      }
    };

    let currentGroupKey = "mayans";

    function loadGroupData() {
      currentGroupKey = document.getElementById("groupSelect").value;
      const group = groupsData[currentGroupKey];

      document.getElementById("activeGroupNameBadge").innerText = group.name;

      // Render Harga Ammo
      const ammoListDiv = document.getElementById("ammoPriceList");
      const ammoSelect = document.getElementById("ammoType");
      ammoListDiv.innerHTML = "";
      ammoSelect.innerHTML = "";

      for (let ammo in group.ammo) {
        const price = group.ammo[ammo];
        ammoListDiv.innerHTML += `
          <div class="flex justify-between bg-slate-900/80 p-3 rounded-xl border border-slate-800">
            <span>${ammo} (1 pack)</span>
            <span class="font-bold text-green-400">${price.toLocaleString('id-ID')}</span>
          </div>`;
        ammoSelect.innerHTML += `<option value="${ammo}">${ammo} (${price.toLocaleString('id-ID')}/pack)</option>`;
      }

      // Render Harga Barang/Layanan
      const itemListDiv = document.getElementById("itemPriceList");
      const itemSelect = document.getElementById("itemType");
      itemListDiv.innerHTML = "";
      itemSelect.innerHTML = "";

      for (let item in group.items) {
        const data = group.items[item];
        const displayPrice = data.isRate ? `${data.price * 100}%` : `${data.price.toLocaleString('id-ID')} / PC`;

        itemListDiv.innerHTML += `
          <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800">
            <div class="text-gray-400">${item}</div>
            <div class="font-bold text-red-400">${displayPrice}</div>
            ${data.promo ? `<div class="text-[10px] text-amber-400 mt-0.5">${data.promo}</div>` : ''}
          </div>`;
        
        itemSelect.innerHTML += `<option value="${item}">${item} (${displayPrice})</option>`;
      }

      calcAmmo();
      calcItem();
    }

    function calcAmmo() {
      const group = groupsData[currentGroupKey];
      const type = document.getElementById("ammoType").value;
      const qty = parseInt(document.getElementById("ammoQty").value) || 0;
      
      if (!type || !group.ammo[type]) {
        document.getElementById("totalAmmoPrice").innerText = "0";
        return;
      }

      const total = group.ammo[type] * qty;
      document.getElementById("totalAmmoPrice").innerText = total.toLocaleString('id-ID');
    }

    function calcItem() {
      const group = groupsData[currentGroupKey];
      const type = document.getElementById("itemType").value;
      const qty = parseFloat(document.getElementById("itemQty").value) || 0;

      if (!type || !group.items[type]) {
        document.getElementById("totalItemPrice").innerText = "0";
        document.getElementById("bonusInfo").innerText = "Dapat Total: 0";
        return;
      }

      const data = group.items[type];
      let totalCost = 0;
      let bonusText = `Dapat Total: ${qty} PC`;

      if (data.isRate) {
        totalCost = qty * data.price;
        bonusText = `Fee (${data.price * 100}%): ${totalCost.toLocaleString('id-ID')}`;
      } else {
        totalCost = data.price * qty;
        if (type === "DA" && data.promo.includes("10 Free 2")) {
          const bonusPcs = Math.floor(qty / 10) * 2;
          bonusText = bonusPcs > 0 ? `Dapat Total: ${qty + bonusPcs} PC (Bonus ${bonusPcs} PC)` : `Dapat Total: ${qty} PC`;
        }
      }

      document.getElementById("totalItemPrice").innerText = totalCost.toLocaleString('id-ID');
      document.getElementById("bonusInfo").innerText = bonusText;
    }

    function copySummary() {
      const groupName = groupsData[currentGroupKey].name;
      const ammoType = document.getElementById("ammoType").value || "-";
      const ammoQty = document.getElementById("ammoQty").value || 0;
      const ammoTotal = document.getElementById("totalAmmoPrice").innerText;

      const itemType = document.getElementById("itemType").value || "-";
      const itemQty = document.getElementById("itemQty").value || 0;
      const itemTotal = document.getElementById("totalItemPrice").innerText;
      const bonusInfo = document.getElementById("bonusInfo").innerText;

      const text = `🤝 *TRANSAKSI PARTNER: ${groupName.toUpperCase()}*\n\n` +
                   `📦 *Penjualan Ammo:*\n` +
                   `- ${ammoType} (${ammoQty} Pack) = Rp ${ammoTotal}\n\n` +
                   `🛒 *Pembelian / Layanan:*\n` +
                   `- ${itemType} (${itemQty}) = Rp ${itemTotal}\n` +
                   `- Detail: ${bonusInfo}`;

      navigator.clipboard.writeText(text);
      alert(`Ringkasan transaksi untuk ${groupName} berhasil disalin!`);
    }

    // Initial load
    loadGroupData();
  </script>
</body>
</html>
