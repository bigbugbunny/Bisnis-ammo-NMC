<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NMC Ammo Crafting & Business Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { background-color: #0b0f19; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .neon-border-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); border: 1px solid rgba(34, 197, 94, 0.5); }
    .neon-border-blue { box-shadow: 0 0 15px rgba(59, 130, 246, 0.3); border: 1px solid rgba(59, 130, 246, 0.5); }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="text-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-center bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl">
      <div>
        <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-200">
          ⚡ NMC AMMO CRAFTING HUB
        </h1>
        <p class="text-sm text-gray-400 mt-1">Sistem Pengelola Management Crafting & Kalkulator Business Pro</p>
      </div>
      <div class="mt-4 md:mt-0 flex gap-2">
        <span class="bg-green-500/20 text-green-400 text-xs font-semibold px-3 py-1.5 rounded-full border border-green-500/30 flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-green-400 animate-ping"></span> System Active
        </span>
      </div>
    </div>

    <!-- Grid Utama -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Panel Input & Resep (1 Column) -->
      <div class="space-y-6">
        <!-- Input Form -->
        <div class="glass-card p-6 rounded-2xl border border-slate-700 shadow-lg space-y-4">
          <h2 class="text-lg font-bold text-green-400 flex items-center gap-2">
            <i class="fa-solid fa-sliders"></i> Input Pesanan
          </h2>

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Tipe Ammo</label>
            <select id="ammoSelect" onchange="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-green-500 transition">
              <option value="50AE">50AE (Umer: 20K)</option>
              <option value="9MM" selected>9MM (Umer: 60K)</option>
              <option value="38LC">38LC (Umer: 70K)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Jumlah Pack</label>
            <input type="number" id="packQty" value="10" min="1" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-white focus:outline-none focus:border-green-500 transition">
          </div>

          <hr class="border-slate-700 my-4">

          <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Estimasi Keuangan (Opsional)</h3>
          
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs text-gray-400 mb-1">Modal Beli / Pack</label>
              <input type="number" id="modalPrice" value="0" placeholder="0" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-green-500">
            </div>
            <div>
              <label class="block text-xs text-gray-400 mb-1">Harga Jual / Pack</label>
              <input type="number" id="sellPrice" value="100000" oninput="calculate()" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-2.5 text-sm text-white focus:outline-none focus:border-green-500">
            </div>
          </div>
        </div>
      </div>

      <!-- Panel Output Bahan & Keuangan (2 Columns) -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- Total Bahan Required -->
        <div class="glass-card p-6 rounded-2xl border border-slate-700 shadow-lg neon-border-green">
          <h2 class="text-lg font-bold text-green-400 mb-4 flex items-center justify-between">
            <span><i class="fa-solid fa-boxes-stacked"></i> Total Kebutuhan Bahan</span>
            <span id="badgeAmmo" class="text-xs bg-emerald-500/20 text-emerald-300 px-3 py-1 rounded-full border border-emerald-500/30">9MM x10 Pack</span>
          </h2>

          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <!-- Iron -->
            <div class="bg-slate-900/90 p-4 rounded-xl border border-slate-800">
              <div class="flex items-center justify-between text-gray-400 text-sm mb-1">
                <span>🔩 Iron</span>
                <span class="text-xs bg-slate-800 px-2 py-0.5 rounded text-gray-400">Req: 50/pack</span>
              </div>
              <div id="totalIron" class="text-2xl font-black text-amber-400">500</div>
            </div>

            <!-- Carbon -->
            <div class="bg-slate-900/90 p-
